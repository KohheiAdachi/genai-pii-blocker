name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 単体テスト
        run: npm test

      # ADR-0002 の4層のうち「ビルド層」。ADR-0008 の console 出力禁止もここで検査する。
      - name: 外部通信ゼロのチェック
        run: npm run check:no-network
